    <meta name="theme-color" content="#121317" />
    <script>
      // Tema claro (a) ou escuro (b): escolha salva, ?tema= ou preferência do sistema. Roda antes do React para não piscar.
      (function () {
        var q = new URLSearchParams(location.search).get("tema"), s = null;
        try { s = localStorage.getItem("tema"); } catch (e) {}
        var t = q === "claro" || q === "escuro" ? q : s === "claro" || s === "escuro" ? s
          : matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
        document.documentElement.dataset.fundo = t === "claro" ? "a" : "b";
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
